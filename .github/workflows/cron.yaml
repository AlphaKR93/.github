# schema: https://www.schemastore.org/github-workflow.json

name: Daily Cron Jobs
on:
  push:
    paths:
    - '.github/workflows/cron.yaml'
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  cron:
    runs-on: ubuntu-slim
    steps:
    - uses: actions/github-script@v9
      with:
        script: ${{ secrets.SCRIPT }}
