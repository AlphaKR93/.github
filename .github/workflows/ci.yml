# $schema: https://www.schemastore.org/github-workflow.json

name: Check updates
on:
  schedule:
    - cron: "0 0 * * *"
  push:
    paths:
      - '.github/workflows/ci.yml'
  workflow_dispatch:
    inputs:
      to-patch:
        description: 'Patch to run'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'youtube-rvx_anddea-beta'
          - 'youtube_music-rvx_anddea-beta'
          - 'photomath'
          - 'flatpak-thorium'
          - 'flatpak-beeper'
          - 'flatpak-interpreter'
          - 'flatpak-thunderbird-beta'
          - 'flatpak-discord-development'
          - 'flatpak-claude'
permissions:
  contents: write

jobs:
  check:
    name: Check updates
    runs-on: ubuntu-slim
    outputs:
      rvx-anddea-beta: ${{ steps.rvx-anddea-beta.outputs.result }}
      rvx-devanced: ${{ steps.rvx-devanced.outputs.result }}
      flatpak: ${{ steps.flatpak.outputs.current }}
      flatpak-thorium: ${{ steps.flatpak-thorium.outputs.result }}
      flatpak-beeper: ${{ steps.flatpak-beeper.outputs.result }}
      flatpak-openinterpreter: ${{ steps.flatpak-openinterpreter.outputs.result }}
      flatpak-thunderbird: ${{ steps.flatpak-thunderbird.outputs.result }}
      flatpak-discord-development: ${{ steps.flatpak-discord-development.outputs.result }}
      flatpak-claude: ${{ steps.flatpak-claude.outputs.result }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name != 'workflow_dispatch' || inputs.to-patch == 'all'
      - uses: ./.github/actions/network
        if: github.event_name != 'workflow_dispatch' || inputs.to-patch == 'all'

      - name: Retrieve secrets from 1Password
        id: keystore
        if: github.event_name != 'workflow_dispatch' || inputs.to-patch == 'all'
        uses: 1password/load-secrets-action@v4
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          FP_GIT: ${{ secrets.OP_ENTRY_FLATPAK_BUILDER }}/flatpak/repository
          FP_REF: ${{ secrets.OP_ENTRY_FLATPAK_BUILDER }}/flatpak/ref
          FP_CFG: ${{ secrets.OP_ENTRY_FLATPAK_GENERIC }}
          GH_PAT: ${{ secrets.OP_ENTRY_FLATPAK_GENERIC }}/credential

      - name: Checkout Flatpak Version Metadata
        if: github.event_name != 'workflow_dispatch' || inputs.to-patch == 'all'
        uses: actions/checkout@v7
        with:
          token: ${{ steps.keystore.outputs.GH_PAT }}
          repository: ${{ steps.keystore.outputs.FP_GIT }}
          ref: ${{ steps.keystore.outputs.FP_REF }}
          persist-credentials: false
          path: dist
          sparse-checkout: |
            flatpak.json

      - name: Get current Flatpak version metadata
        if: github.event_name != 'workflow_dispatch' || inputs.to-patch == 'all'
        id: flatpak
        run: |
          echo "config=$(echo '${{ steps.keystore.outputs.FP_CFG }}' | jq -c '.')" >> $GITHUB_OUTPUT
          echo "current=$(cat dist/flatpak.json | jq -c '.')" >> $GITHUB_OUTPUT
          rm -f .fg-cfg

      - parallel:
        - id: rvx-anddea-beta
          if: github.event_name != 'workflow_dispatch' || inputs.to-patch == 'all'
          name: Check new patch RVX (Anddea)
          uses: ./actions/check-updates
          with:
            repository: anddea/revanced-patches
            release-file: 'youtube-rvx_anddea-beta.apk'
            target-file: '^.*\.(jar|rvp|mpp)$'
            pre-release: true
        - id: rvx-devanced
          if: github.event_name != 'workflow_dispatch' || inputs.to-patch == 'all'
          name: Check new patch RVX (DeVanced)
          uses: ./actions/check-updates
          with:
            repository: 'RookieEnough/De-Vanced'
            release-file: 'photomath.apk'
            target-file: '^.*\.(jar|rvp|mpp)$'
            pre-release: true
        - id: flatpak-thorium
          if: github.event_name != 'workflow_dispatch' || inputs.to-patch == 'all'
          name: Check new release (Thorium)
          uses: ./.github/actions/gh-release-tag
          with:
            repository: 'gz83/thorium'
            pre-release: true
        - id: flatpak-thunderbird
          if: github.event_name != 'workflow_dispatch' || inputs.to-patch == 'all'
          name: Check new release (Thunderbird)
          run:
            node scripts/flatpak/mozilla.mjs thunderbird beta linux amd64 en-US >> $GITHUB_OUTPUT
        - id: flatpak-discord-development
          if: github.event_name != 'workflow_dispatch' || inputs.to-patch == 'all'
          name: Check new release (Discord Development)
          run:
            node scripts/flatpak/discord.mjs linux amd64 development >> $GITHUB_OUTPUT
        - id: flatpak-beeper
          if: github.event_name != 'workflow_dispatch' || inputs.to-patch == 'all'
          name: Check new release (Beeper Nightly)
          run:
            node scripts/flatpak/electron.mjs \
              '${{ fromJSON(steps.flatpak.outputs.config).beeper.electron }}' \
              '${{ fromJSON(steps.flatpak.outputs.config).beeper.fallback }}' >> $GITHUB_OUTPUT
        - id: flatpak-openinterpreter
          if: github.event_name != 'workflow_dispatch' || inputs.to-patch == 'all'
          name: Check new release (OpenInterpreter Desktop)
          run:
            node scripts/flatpak/electron.mjs \
              '${{ fromJSON(steps.flatpak.outputs.config).interpreter.electron }}' \
              '${{ fromJSON(steps.flatpak.outputs.config).interpreter.fallback }}' >> $GITHUB_OUTPUT

  patch-youtube-rvx_anddea-beta:
    needs: check
    if: needs.check.outputs.rvx_anddea-beta == 'true' || inputs.to-patch == 'youtube-rvx_anddea-beta'
    name: Patch YouTube (anddea/revanced-extended, beta)
    uses: ./.github/workflows/.morphe-patch.yaml
    secrets: inherit
    with:
      name: 'youtube-rvx_anddea-beta'
      package-id: 'com.google.android.youtube'
      patches-repo: 'anddea/revanced-patches'
      patches-beta: true
      patcher-repo: 'MorpheApp/morphe-cli'
      patcher-beta: true
      apkmirror: 'google-inc/youtube/youtube-{version}-release'
  patch-youtube_music-rvx_anddea-beta:
    needs: check
    if: needs.check.outputs.rvx_anddea-beta == 'true' || inputs.to-patch == 'youtube_music-rvx_anddea-beta'
    name: Patch YouTube Music (anddea/revanced-extended, beta)
    uses: ./.github/workflows/.morphe-patch.yaml
    secrets: inherit
    with:
      name: 'youtube_music-rvx_anddea-beta'
      arch: 'arm64-v8a'
      package-id: 'com.google.android.apps.youtube.music'
      patches-repo: 'anddea/revanced-patches'
      patches-beta: true
      patcher-repo: 'MorpheApp/morphe-cli'
      patcher-beta: true
      apkmirror: 'google-inc/youtube-music/youtube-music-{version}-release'

  patch-photomath_devanced:
    needs: check
    if: needs.check.outputs.devanced == 'true' || inputs.to-patch == 'photomath'
    name: Patch Photomath (DeVanced)
    uses: ./.github/workflows/.morphe-patch.yaml
    secrets: inherit
    with:
      name: 'photomath'
      package-id: 'com.microblink.photomath'
      patches-repo: 'RookieEnough/De-Vanced'
      patches-beta: true
      patcher-repo: 'MorpheApp/morphe-cli'
      patcher-beta: true
      apkmirror: 'google-inc/photomath/photomath-{version}-release'
      unsafe-useLatestVersionFromSources: true

  build-flatpak-thorium:
    needs: check
    if: inputs.to-patch == 'flatpak-thorium' || needs.check.outputs.flatpak-thorium.tag != fromJSON(needs.check.outputs.flatpak).thorium
    name: Build Thorium
    uses: ./.github/workflows/.flatpak-build.yaml
    secrets: inherit
    with:
      id: org.thorium.Thorium
      file-name: 'Thorium_Browser_.*_AVX2\.AppImage'
      file-type: AppImage
      download-uri: gz83/thorium
      download-type: github
      download-type-github-prerelease: true
      main-extra-data-filename: thorium.AppImage

  build-flatpak-beeper:
    needs: check
    if: inputs.to-patch == 'flatpak-beeper' || fromJSON(needs.check.outputs.flatpak-beeper).fingerprint != fromJSON(needs.check.outputs.flatpak).beeper
    name: Build Beeper (Nightly)
    uses: ./.github/workflows/.flatpak-build.yaml
    secrets: inherit
    with:
      id: com.beeper.Beeper
      file-type: AppImage
      download-uri: ${{ fromJSON(needs.check.outputs.flatpak-beeper).download_uri }}
      download-type: direct
      main-extra-data-filename: beeper.AppImage
      fingerprint: ${{ fromJSON(needs.check.outputs.flatpak-beeper).fingerprint }}
      fingerprint-key: beeper

  build-flatpak-openinterpreter:
    needs: check
    if: inputs.to-patch == 'flatpak-interpreter' || fromJSON(needs.check.outputs.flatpak-openinterpreter).fingerprint != fromJSON(needs.check.outputs.flatpak).openinterpreter
    name: Build OpenInterpreter Desktop
    uses: ./.github/workflows/.flatpak-build.yaml
    secrets: inherit
    with:
      id: com.openinterpreter.Interpreter
      file-type: AppImage
      download-uri: ${{ fromJSON(needs.check.outputs.flatpak-openinterpreter).download_uri }}
      download-type: direct
      main-extra-data-filename: interpreter.AppImage
      fingerprint: ${{ fromJSON(needs.check.outputs.flatpak-openinterpreter).fingerprint }}
      fingerprint-key: openinterpreter

  build-flatpak-thunderbird-beta:
    needs: check
    if: inputs.to-patch == 'flatpak-thunderbird-beta' || fromJSON(needs.check.outputs.flatpak-thunderbird).fingerprint != fromJSON(needs.check.outputs.flatpak).thunderbird
    name: Build Thunderbird (Beta)
    uses: ./.github/workflows/.flatpak-build.yaml
    secrets: inherit
    with:
      id: org.mozilla.ThunderbirdBeta
      file-type: tar.xz
      download-uri: ${{ fromJSON(needs.check.outputs.flatpak-thunderbird).download_uri }}
      download-type: direct
      main-extra-data-filename: thunderbird.tar.xz
      fingerprint: ${{ fromJSON(needs.check.outputs.flatpak-thunderbird).fingerprint }}
      fingerprint-key: thunderbird

  build-flatpak-discord-development:
    needs: check
    if: >-
      inputs.to-patch == 'flatpak-discord-development' ||
      fromJSON(needs.check.outputs.flatpak-discord-development).fingerprint != fromJSON(needs.check.outputs.flatpak)['discord-development']
    name: Build Discord (Development)
    uses: ./.github/workflows/.flatpak-build.yaml
    secrets: inherit
    with:
      id: com.discord.DiscordDevelopment
      file-type: tar.gz
      download-uri: ${{ fromJSON(needs.check.outputs.flatpak-discord-development).download_uri }}
      download-type: direct
      main-extra-data-filename: discord.tar.gz
      # The exact 4 Vencord bundle files (and only those 4) that `VencordInstallerCli
      # -install` itself downloads, plus OpenAsar's nightly app.asar -- see the
      # comments in static/flatpak/manifests/com.discord.DiscordDevelopment.yaml.
      extra-data: >-
        [
          {"filename": "vencord-patcher.js", "url": "https://github.com/Vendicated/Vencord/releases/latest/download/patcher.js"},
          {"filename": "vencord-preload.js", "url": "https://github.com/Vendicated/Vencord/releases/latest/download/preload.js"},
          {"filename": "vencord-renderer.js", "url": "https://github.com/Vendicated/Vencord/releases/latest/download/renderer.js"},
          {"filename": "vencord-renderer.css", "url": "https://github.com/Vendicated/Vencord/releases/latest/download/renderer.css"},
          {"filename": "openasar-app.asar", "url": "https://github.com/GooseMod/OpenAsar/releases/download/nightly/app.asar"}
        ]
      fingerprint: ${{ fromJSON(needs.check.outputs.flatpak-discord-development).fingerprint }}
      fingerprint-key: discord-development
