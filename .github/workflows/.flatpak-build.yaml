# $schema: https://www.schemastore.org/github-workflow.json

name: Build Flatpak Package

on:
  workflow_call:
    inputs:
      id:
        type: string
        required: true
        description: Application ID of the package

      file-name:
        type: string
        required: false
        default: ''
        description: |
          Regular expression rule of the downloaded file name.
          Only used (and required) for `download-type: github`.
      file-type:
        type: string
        required: true
        description: |
          Type of Package
          One of: (AppImage, tar.gz, tar.xz)

      download-uri:
        type: string
        required: true
        description: |
          Package download URI of the package.
          For `download-type: github`, the `owner/repo` to look up a release asset in.
          For `download-type: direct`, the literal, already-resolved download URL.
      download-type:
        type: string
        required: true
        description: |
          Type of Download URI
          One of: (direct, github)

      download-type-github-prerelease:
        type: boolean
        required: false
        default: false
        description: Whether to use prerelease on GitHub Release

      main-extra-data-filename:
        type: string
        required: true
        description: |
          The `filename` of the module's main `type: extra-data` source in
          static/flatpak/manifests/<id>.yaml (e.g. "thorium.AppImage",
          "discord.tar.gz"). Its `url`/`sha256`/`size` are patched with the values
          resolved from `download-uri` above.

      extra-data:
        type: string
        required: false
        default: '[]'
        description: |
          JSON array of additional `type: extra-data` sources to resolve and patch,
          beyond the main one above. Each entry: { "filename": string, "url": string }.
          Used e.g. by com.discord.DiscordDevelopment to inject Vencord/OpenAsar.

      fingerprint:
        type: string
        required: false
        default: ''
        description: |
          Fingerprint of the currently checked release, written into
          repo/flatpak.yaml under `fingerprint-key`. Leave empty (together with
          fingerprint-key) to skip updating repo/flatpak.yaml, e.g. for
          `download-type: github` packages, which are tracked by release tag instead.
      fingerprint-key:
        type: string
        required: false
        default: ''
        description: Top-level key to set in repo/flatpak.yaml. Leave empty to skip updating it.

    secrets:
      OP_SERVICE_ACCOUNT_TOKEN:
        required: true
      OP_ENTRY_FLATPAK_BUILDER:
        required: true

jobs:
  build:
    name: Build Flatpak Package
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - name: Retrieve secrets from 1Password
        id: keystore
        uses: 1password/load-secrets-action@v4
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          GH_PAT: ${{ secrets.OP_ENTRY_FLATPAK_GENERIC }}/credential
          KS_GIT: ${{ secrets.OP_ENTRY_FLATPAK_BUILDER }}/keystroke/repository
          KS_REF: ${{ secrets.OP_ENTRY_FLATPAK_BUILDER }}/keystroke/ref
          FP_GIT: ${{ secrets.OP_ENTRY_FLATPAK_BUILDER }}/flatpak/repository
          FP_REF: ${{ secrets.OP_ENTRY_FLATPAK_BUILDER }}/flatpak/ref

      - name: Checkout Flatpak repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.keystore.outputs.GH_PAT }}
          repository: ${{ steps.keystore.outputs.FP_GIT }}
          ref: ${{ steps.keystore.outputs.FP_REF }}
          path: repo
          submodules: true
          persist-credentials: false

      - name: Checkout Keystrokes
        uses: actions/checkout@v7
        with:
          token: ${{ steps.keystore.outputs.GH_PAT }}
          repository: ${{ steps.keystore.outputs.KS_GIT }}
          ref: ${{ steps.keystore.outputs.KS_REF }}
          path: keys
          submodules: true
          persist-credentials: false

      # Only resolves which exact release asset to use (and downloads it to
      # source.${{ inputs.file-type }} for icon/desktop-file extraction below); the
      # real url/sha256/size that end up in the manifest are always (re)computed from
      # the downloaded bytes by "Resolve extra-data sources", regardless of
      # download-type.
      - id: download-github
        if: inputs.download-type == 'github'
        name: Download from GitHub
        uses: ./.github/actions/gh-download-asset
        with:
          repository: ${{ inputs.download-uri }}
          file: ${{ inputs.file-name }}
          pre-release: ${{ inputs.download-type-github-prerelease }}
          name: source.${{ inputs.file-type }}

      # Downloads (if download-type == direct; a no-op re-hash otherwise, since the
      # file already exists from the step above) and hashes the main package source,
      # plus any additional extra-data sources (e.g. Vencord/OpenAsar for Discord),
      # producing { filename, url, sha256, size } entries ready for the manifest patch
      # below. Neither of these downloads ever gets embedded in the OSTree repo this
      # job pushes: the main source here is only read for icon/desktop-file
      # extraction, and flatpak itself downloads the real, hash-verified files
      # straight to the end user's machine at install time (see each manifest's
      # apply_extra script) -- so GitHub Pages never needs to serve them via LFS.
      - id: extra-data
        name: Resolve extra-data sources
        uses: ./actions/resolve-flatpak-extra-data
        with:
          main: >-
            {"filename": ${{ toJSON(inputs.main-extra-data-filename) }},
             "url": ${{ toJSON(inputs.download-type == 'github' && steps.download-github.outputs.url || inputs.download-uri) }},
             "path": "source.${{ inputs.file-type }}"}
          extra: ${{ inputs.extra-data }}

      - name: Patch Flatpak manifest with resolved sources
        uses: ./actions/patch-flatpak-manifest
        with:
          manifest: static/flatpak/manifests/${{ inputs.id }}.yaml
          output: manifests.yaml
          entries: ${{ steps.extra-data.outputs.entries }}

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: manifests.yaml
          repo-dir: repo/flatpak
          bundle: ${{ inputs.id }}.flatpak
          artifact-name: ${{ inputs.id }}.flatpak
          verbose: true

      - name: Update Flatpak repository fingerprint index
        if: inputs.fingerprint-key != ''
        uses: ./actions/patch-flatpak-index
        with:
          file: repo/flatpak.yaml
          key: ${{ inputs.fingerprint-key }}
          value: ${{ inputs.fingerprint }}

      - name: Commit changes
        run: |
          cd repo
          git add .
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git commit --no-gpg-sign -m 'build: `${{ inputs.id }}`'

      - name: Push Flatpak Repository
        uses: ad-m/github-push-action@v1.3.0
        with:
          token: ${{ steps.keystore.outputs.GH_PAT }}
          repository: ${{ steps.keystore.outputs.FP_GIT }}
          branch: ${{ steps.keystore.outputs.FP_REF }}
          directory: repo
