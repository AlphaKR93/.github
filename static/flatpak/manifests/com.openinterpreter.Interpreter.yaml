# $schema: https://raw.githubusercontent.com/flatpak/flatpak-builder/main/data/flatpak-manifest.schema.json

id: com.openinterpreter.OpenInterpreter
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
base: org.chromium.Chromium.BaseApp
base-version: "25.08"
command: interpreter

finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-download
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.secrets

modules:
  - name: beeper
    buildsystem: simple
    build-commands:
      - chmod +x interpreter.AppImage
      - ./interpreter.AppImage --appimage-extract
      # Install AppImage
      - mkdir -p /app/interpreter
      - cp -a squashfs-root/. /app/interpreter/
      - rm -rf /app/interpreter/AppRun /app/interpreter/interpreter.{desktop,png} /app/interpreter/usr/share
      - install -Dm755 interpreter.sh /app/bin/interpreter
      # Copy Resources
      - cp -a squashfs-root/usr/lib /app/lib
      - install -Dm644 squashfs-root/usr/share/icons/hicolor/1024x1024/apps/interpreter.png /app/share/icons/hicolor/1024x1024/apps/com.openinterpreter.Interpreter.png
      # Install desktop file
      - install -Dm644 squashfs-root/interpreter.desktop /app/share/applications/com.openinterpreter.Interpreter.desktop
      - desktop-file-edit --set-key=Exec --set-value='interpreter %U' --set-icon=com.openinterpreter.Interpreter /app/share/applications/com.openinterpreter.Interpreter.desktop
    sources:
      - type: file
        path: source.AppImage
        dest-filename: interpreter.AppImage
      - type: script
        dest-filename: interpreter.sh
        commands:
          - export TMPDIR="${XDG_RUNTIME_DIR}/app/${FLATPAK_ID}"
          - export LD_LIBRARY_PATH="/app/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          - exec zypak-wrapper /app/interpreter/interpreter "$@"
