# $schema: https://www.schemastore.org/github-action.json

name: Resolve Flatpak Extra Data
description: |
  Downloads (if not already present locally) and hashes a set of files, producing
  { filename, url, sha256, size } entries ready to feed straight into the
  patch-flatpak-manifest action's `entries` input.

inputs:
  main:
    description: |
      Optional single JSON object for the module's main extra-data source:
      { "filename": string, "url": string, "path": string (local file path) }
      Resolved first, ahead of every entry in `extra`. Left empty to omit.
    required: false
    default: ''
  extra:
    description: |
      JSON array of additional sources to resolve, in the same shape as `main`. `path`
      may be omitted, defaulting to `./<filename>`.
      If a file already exists at `path` (e.g. it was already downloaded by an earlier
      step), it is hashed as-is and not re-downloaded. Otherwise it is downloaded from
      `url` to `path` first.
    required: false
    default: '[]'

outputs:
  entries:
    description: JSON array of { filename, url, sha256, size }, in the same order as the input.

runs:
  using: node24
  main: dist/index.js
